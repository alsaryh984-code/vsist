<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

:root {
  --primary: #056e5a;
  --primary-dark: #044f41;
  --gold: #e0b875;
  --bg: #fafaf9;
  --border: #f0f0ef;
  --text: #1c1917;
  --muted: #78716c;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Tajawal', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  direction: rtl;
}

a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; }

/* ===== الصفحة الرئيسية ===== */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(16,42,67,.35), rgba(15,43,44,.25), rgba(15,43,44,.65));
}
.hero-card {
  position: relative; z-index: 10;
  width: 92%; max-width: 420px; margin: 0 auto;
  border-radius: 28px; padding: 28px; text-align: center;
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 25px 50px rgba(0,0,0,.4);
  background: rgba(15,43,44,.72);
}
.hero-logo {
  width: 80px; height: 80px; border-radius: 16px;
  margin: 0 auto 20px; object-fit: cover;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
}
.hero-title { font-size: 36px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
.hero-title span { color: var(--gold); }
.hero-sub { margin-top: 12px; font-size: 18px; font-weight: 700; color: #fff; }
.hero-desc { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.75); line-height: 1.6; }
.hero-btn {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 24px; padding: 12px 28px; border-radius: 999px;
  background: var(--primary); color: #fff; font-weight: 700; font-size: 16px;
  box-shadow: 0 8px 20px rgba(5,110,90,.4); transition: transform .15s;
}
.hero-btn:hover { transform: scale(1.04); }
.hero-stats {
  margin-top: 20px; display: flex; align-items: center; justify-content: center;
  gap: 8px; color: rgba(255,255,255,.7); font-size: 12px;
}
.hero-stats span { font-weight: 700; }

.categories-section { max-width: 480px; margin: 0 auto; padding: 40px 24px; }
.categories-title { font-size: 18px; font-weight: 700; color: #0f2b2c; margin-bottom: 16px; }
.categories-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.cat-card {
  background: #fff; border-radius: 16px; padding: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.04);
  transition: transform .15s, box-shadow .15s;
}
.cat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.08); }
.cat-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}
.cat-label { font-size: 12px; font-weight: 700; color: #44403c; text-align: center; }

.footer { background: #0f2b2c; color: rgba(255,255,255,.6); text-align: center; padding: 24px; font-size: 12px; }

/* ===== صفحة الخريطة ===== */
.map-page { height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
.map-header {
  background: #fff; border-bottom: 1px solid var(--border);
  padding: 12px 16px; display: flex; align-items: center; gap: 12px; z-index: 1000;
}
.back-btn {
  width: 36px; height: 36px; border-radius: 50%; background: #f5f5f4;
  display: flex; align-items: center; justify-content: center; font-size: 18px; color: #44403c;
  transition: background .15s;
}
.back-btn:hover { background: #e7e5e4; }
.map-title { flex: 1; }
.map-title h1 { font-size: 16px; font-weight: 700; color: #0f2b2c; }
.map-title p { font-size: 12px; color: #a8a29e; }
.view-toggle {
  width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}

.chips-bar {
  background: #fff; border-bottom: 1px solid var(--border);
  padding: 8px 12px; z-index: 999; overflow-x: auto; white-space: nowrap;
  display: flex; gap: 8px; scrollbar-width: none;
}
.chips-bar::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
  white-space: nowrap; border: 1px solid #e7e5e4; background: #f5f5f4; color: #44403c;
  transition: all .15s;
}
.chip.active { color: #fff; border-color: transparent; }

.map-wrap { flex: 1; position: relative; }
#map { height: 100%; width: 100%; }

.locate-btn {
  position: absolute; bottom: 24px; left: 16px; z-index: 500;
  width: 48px; height: 48px; border-radius: 50%; background: #fff;
  box-shadow: 0 4px 12px rgba(0,0,0,.15); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 22px;
}

.place-sheet {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 600;
  background: #fff; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.2);
  padding: 16px 16px 24px; transform: translateY(100%); transition: transform .3s ease-out;
}
.place-sheet.show { transform: translateY(0); }
.sheet-handle { width: 40px; height: 4px; background: #d6d3d1; border-radius: 999px; margin: 0 auto 12px; }
.sheet-close {
  position: absolute; top: 12px; left: 12px; width: 32px; height: 32px; border-radius: 50%;
  background: #f5f5f4; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #57534e;
}
.sheet-body { display: flex; gap: 12px; }
.sheet-img { width: 96px; height: 96px; border-radius: 16px; object-fit: cover; flex-shrink: 0; }
.sheet-info { flex: 1; min-width: 0; }
.sheet-cat-row { display: flex; align-items: center; gap: 6px; }
.sheet-cat-badge { width: 24px; height: 24px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.sheet-cat-name { font-size: 12px; font-weight: 700; }
.sheet-name { font-size: 16px; font-weight: 700; color: #1c1917; margin-top: 4px; }
.sheet-rating { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.stars { color: #f59e0b; font-size: 14px; letter-spacing: 1px; }
.sheet-rating-num { font-size: 12px; color: #78716c; font-weight: 700; }
.sheet-desc {
  font-size: 12px; color: #78716c; margin-top: 6px; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.sheet-addr { font-size: 12px; color: #a8a29e; margin-top: 4px; }
.nav-btn {
  margin-top: 8px; display: inline-flex; align-items: center; gap: 6px;
  background: var(--primary); color: #fff; font-size: 12px; font-weight: 700;
  padding: 6px 12px; border-radius: 999px;
}

.list-view { height: 100%; overflow-y: auto; padding: 12px; }
.list-view .place-item {
  width: 100%; background: #fff; border-radius: 16px; padding: 12px; margin-bottom: 8px;
  border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,.03);
  display: flex; gap: 12px; text-align: right; transition: box-shadow .15s;
}
.list-view .place-item:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
.place-item-img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
.place-item-info { flex: 1; min-width: 0; }
.place-item-name { font-size: 14px; font-weight: 700; color: #292524; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place-item-addr { font-size: 12px; color: #a8a29e; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 160px; color: #a8a29e; font-size: 14px; gap: 8px;
}

/* علامة الخريطة */
.pin-wrap { position: relative; width: 36px; height: 36px; }
.pin-body {
  position: absolute; inset: 0; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.3);
}
.pin-emoji { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 4px; font-size: 16px; }
.user-pin {
  width: 22px; height: 22px; border-radius: 50%; background: #2563eb; border: 3px solid #fff;
  box-shadow: 0 0 0 6px rgba(37,99,235,.25), 0 2px 6px rgba(0,0,0,.3);
}

/* نافذة الخريطة */
.leaflet-popup-content-wrapper { border-radius: 12px; direction: rtl; }
.popup-card { width: 200px; font-family: 'Tajawal', sans-serif; }
.popup-img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; }
.popup-name { font-weight: 700; font-size: 14px; margin-top: 6px; color: #1c1917; }
.popup-rating { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.popup-rating-num { font-size: 11px; color: #78716c; }
.popup-desc { font-size: 11px; color: #57534e; margin-top: 4px; line-height: 1.4; }
.popup-addr { font-size: 10px; color: #a8a29e; margin-top: 4px; }
</style>
</head>

  { name: "جبل الصايرة", cat: "attraction", lat: 19.975, lng: 42.585, rating: 4.3, addr: "محافظة بيشة، منطقة عسير", desc: "معلم طبيعي يتميز بحجاراته الملونة ومظهره الفريد الذي يجعله مقصداً لهواة المغامرة والاستكشاف." }
];

PLACES.forEach(p => { p.image = REAL_PHOTOS[p.name] || CATEGORY_IMAGES[p.cat]; });

let activeCat = 'all';
let view = 'map';
let userLoc = null;
let map = null;
let markers = {};
let activePlace = null;
let mapInited = false;
let userMarker = null;
let userCircle = null;

function showHome() {
  document.getElementById('homeView').style.display = 'block';
  document.getElementById('mapView').style.display = 'none';
  window.scrollTo(0, 0);
}
function showMap(cat) {
  activeCat = cat || 'all';
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('mapView').style.display = 'flex';
  if (!mapInited) { initMap(); mapInited = true; }
  setTimeout(() => { if (map) map.invalidateSize(); }, 100);
  renderChips();
  renderMarkers();
  renderList();
  updateCount();
  hideSheet();
}

document.getElementById('placeCount').textContent = PLACES.length + ' مكان حقيقي';
const grid = document.getElementById('catGrid');
CATEGORIES.forEach(cat => {
  const a = document.createElement('button');
  a.className = 'cat-card';
  a.innerHTML = `<div class="cat-icon" style="background:${cat.bg}"><span style="font-size:24px">${cat.emoji}</span></div><span class="cat-label">${cat.label}</span>`;
  a.onclick = () => showMap(cat.key);
  grid.appendChild(a);
});

function filteredPlaces() {
  return activeCat === 'all' ? PLACES : PLACES.filter(p => p.cat === activeCat);
}
function updateCount() {
  document.getElementById('placeCountMap').textContent = filteredPlaces().length + ' مكان';
}
function renderChips() {
  const bar = document.getElementById('chipsBar');
  bar.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (activeCat === 'all' ? ' active' : '');
  allChip.textContent = 'الكل';
  if (activeCat === 'all') allChip.style.background = '#056e5a';
  allChip.onclick = () => setCat('all');
  bar.appendChild(allChip);
  CATEGORIES.forEach(cat => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeCat === cat.key ? ' active' : '');
    chip.innerHTML = `<span>${cat.emoji}</span> ${cat.label}`;
    if (activeCat === cat.key) chip.style.background = cat.color;
    chip.onclick = () => setCat(cat.key);
    bar.appendChild(chip);
  });
}
function setCat(key) {
  activeCat = key;
  activePlace = null;
  hideSheet();
  renderChips();
  renderMarkers();
  renderList();
  updateCount();
}
function makeIcon(catKey) {
  const cat = CATEGORY_MAP[catKey] || CATEGORY_MAP.attraction;
  const html = `<div class="pin-wrap"><div class="pin-body" style="background:${cat.color}"></div><div class="pin-emoji">${cat.emoji}</div></div>`;
  return L.divIcon({ html, className: '', iconSize: [36, 36], iconAnchor: [18, 36], popupAnchor: [0, -36] });
}
function initMap() {
  if (typeof L === 'undefined') {
    alert('تعذر تحميل مكتبة الخريطة. تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.');
    return;
  }
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([19.9847, 42.6033], 13);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
  const iconCache = {};
  CATEGORIES.forEach(c => { iconCache[c.key] = makeIcon(c.key); });
  window._iconCache = iconCache;
}
function renderMarkers() {
  if (!map) return;
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  filteredPlaces().forEach(p => {
    const m = L.marker([p.lat, p.lng], { icon: window._iconCache[p.cat] }).addTo(map);
    m.on('click', () => openPlace(p));
    markers[p.name] = m;
  });
}
function openPlace(p) {
  activePlace = p;
  const cat = CATEGORY_MAP[p.cat];
  document.getElementById('sheetBody').innerHTML = `
    <img class="sheet-img" src="${p.image}" alt="${p.name}">
    <div class="sheet-info">
      <div class="sheet-cat-row"><div class="sheet-cat-badge" style="background:${cat.bg}">${cat.emoji}</div><span class="sheet-cat-name" style="color:${cat.color}">${cat.label}</span></div>
      <h3 class="sheet-name">${p.name}</h3>
      <div class="sheet-rating"><span class="stars">${'★'.repeat(Math.round(p.rating))}${'☆'.repeat(5 - Math.round(p.rating))}</span><span class="sheet-rating-num">${p.rating.toFixed(1)}</span></div>
      ${p.desc ? `<p class="sheet-desc">${p.desc}</p>` : ''}
      ${p.addr ? `<p class="sheet-addr">📍 ${p.addr}</p>` : ''}
      <button class="nav-btn" onclick="navigate()">🧭 الاتجاهات</button>
    </div>`;
  document.getElementById('placeSheet').classList.add('show');
  if (map) map.flyTo([p.lat, p.lng], 15, { duration: 1 });
}
function hideSheet() {
  document.getElementById('placeSheet').classList.remove('show');
  activePlace = null;
}
function navigate() {
  if (!activePlace) return;
  const from = userLoc ? userLoc.join(',') : '';
  window.open(`https://www.openstreetmap.org/directions?from=${from}&to=${activePlace.lat},${activePlace.lng}`, '_blank');
}
function renderList() {
  const list = document.getElementById('listView');
  const places = filteredPlaces();
  if (places.length === 0) {
    list.innerHTML = '<div class="empty-state"><span style="font-size:32px">⭐</span>لا توجد أماكن في هذا التصنيف</div>';
    return;
  }
  list.innerHTML = '';
  places.forEach(p => {
    const item = document.createElement('button');
    item.className = 'place-item';
    item.innerHTML = `
      <img class="place-item-img" src="${p.image}" alt="${p.name}">
      <div class="place-item-info">
        <div class="place-item-name">${p.name}</div>
        <div class="sheet-rating"><span class="stars" style="font-size:12px">${'★'.repeat(Math.round(p.rating))}${'☆'.repeat(5 - Math.round(p.rating))}</span><span class="sheet-rating-num">${p.rating.toFixed(1)}</span></div>
        ${p.addr ? `<div class="place-item-addr">${p.addr}</div>` : ''}
      </div>`;
    item.onclick = () => { if (view === 'list') setView('map'); openPlace(p); };
    list.appendChild(item);
  });
}
function setView(v) {
  view = v;
  document.getElementById('map').style.display = v === 'map' ? 'block' : 'none';
  document.getElementById('listView').style.display = v === 'list' ? 'block' : 'none';
  document.getElementById('placeSheet').style.display = v === 'map' ? 'block' : 'none';
  document.getElementById('locateBtn').style.display = v === 'map' ? 'flex' : 'none';
  document.getElementById('viewToggle').textContent = v === 'map' ? '☰' : '🗺️';
  if (v === 'map' && map) setTimeout(() => map.invalidateSize(), 100);
}
function locate() {
  if (!navigator.geolocation) { alert('المتصفح لا يدعم تحديد الموقع'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    userLoc = [pos.coords.latitude, pos.coords.longitude];
    if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
    if (userCircle) { map.removeLayer(userCircle); userCircle = null; }
    userCircle = L.circle(userLoc, { radius: 300, color: '#2563eb', fillColor: '#2563eb', fillOpacity: 0.08, weight: 1 }).addTo(map);
    userMarker = L.marker(userLoc, { icon: L.divIcon({ html: '<div class="user-pin"></div>', className: '', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map);
    map.flyTo(userLoc, 14, { duration: 1.2 });
  }, () => alert('تعذر تحديد موقعك'), { enableHighAccuracy: true, timeout: 8000 });
}

document.getElementById('viewToggle').onclick = () => setView(view === 'map' ? 'list' : 'map');
document.getElementById('locateBtn').onclick = locate;
document.getElementById('sheetClose').onclick = hideSheet;
</script>
</body>
</html>
